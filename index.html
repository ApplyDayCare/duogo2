    <script>
      // Capture PWA install event early before any React components mount
      window.__pwaPrompt = null;
      window.__pwaInstalled = false;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        console.log('[PWA] beforeinstallprompt captured globally');
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaPrompt = null;
        window.__pwaInstalled = true;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
        console.log('[PWA] app was installed');
      });

      // Force unregister stale service workers and purge all cached assets
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          if (regs.length > 0) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
                  console.log('[Cache] Purged stale service worker and caches. Reloading fresh.');
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) { caches.delete(key); });
        });
      }
    </script>
